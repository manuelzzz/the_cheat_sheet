name: Suggest a Cheat Sheet
description: Request a cheat sheet that doesn't exist yet
title: '[Cheat Sheet]: '
labels: ['content']
body:
  - type: input
    id: topic
    attributes:
      label: Topic
      description: What should the cheat sheet cover? (e.g. "Kubernetes", "Redis", "Vim")
    validations:
      required: true

  - type: input
    id: category
    attributes:
      label: Category
      description: Which category should it live under? (e.g. `frameworks`, `languages`, `tools`) Suggest a new one if none fit.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why is this useful?
      description: What would readers use this cheat sheet for?
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Links to official docs, related cheat sheets, or anything else relevant.
